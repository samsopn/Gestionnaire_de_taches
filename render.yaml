# Blueprint Render : Web Service Docker + PostgreSQL
# https://render.com/docs/blueprint-spec

databases:
  - name: todo-mvc-db
    plan: free
    databaseName: todo_mvc
    user: todo_mvc

services:
  - type: web
    name: todo-mvc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: todo-mvc-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # Définir APP_KEY et APP_URL dans le dashboard après le 1er déploiement
